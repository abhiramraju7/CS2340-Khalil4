{% extends 'base.html' %}

{% block content %}
<h1>{{ heading }}</h1>
<form method="post" class="card card-body">
    {% csrf_token %}
    {{ form.as_p }}
    <div>
        <button class="btn btn-primary" type="submit">Save listing</button>
        <a class="btn btn-link" href="{% url 'jobs.my_listings' %}">Cancel</a>
    </div>
</form>
{% endblock content %}
