{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h1>My job listings</h1>
    <a class="btn btn-primary" href="{% url 'jobs.create' %}">Post a job</a>
</div>

<div class="list-group">
    {% for job in jobs %}
    <div class="list-group-item d-flex justify-content-between align-items-center">
        <div>
            <strong>{{ job.title }}</strong> at {{ job.company }}
            {% if job.location %}<span class="text-muted">&mdash; {{ job.location }}</span>{% endif %}
        </div>
        <a class="btn btn-outline-secondary btn-sm" href="{% url 'jobs.edit' job.id %}">Edit</a>
    </div>
    {% empty %}
    <div class="list-group-item text-muted">You have not posted any job listings yet.</div>
    {% endfor %}
</div>
{% endblock content %}
